name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_eval_gate:
        description: "Run the strict 100+ task Agent EvalOps gate against data/eval_results/agent_eval.json"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    name: Tests and smoke gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compile Python modules
        run: python -m compileall -q api agents core config frontend models scripts mcp_server.py

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run Agent EvalOps smoke gate
        run: >
          python scripts/check_agent_eval_gate.py
          --input data/eval_results/agent_eval.json
          --min-tasks 1
          --min-task-success-rate 0.80
          --min-tool-accuracy 0.80
          --max-forbidden-tool-violation-rate 0.01
          --max-max-steps-reached-rate 0.05

  full-evalops-gate:
    name: Strict EvalOps gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_eval_gate == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run strict Agent EvalOps gate
        run: >
          python scripts/check_agent_eval_gate.py
          --input data/eval_results/agent_eval.json
          --min-tasks 100
          --min-task-success-rate 0.80
          --min-tool-accuracy 0.80
          --max-forbidden-tool-violation-rate 0.01
          --max-max-steps-reached-rate 0.05
