[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "email-rag-agent"
version = "0.1.0"
description = "Agentic email RAG system with FastAPI, Streamlit, MCP tools, approvals, and EvalOps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "openai>=1.30.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",
  "streamlit>=1.35.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "sseclient-py>=1.7.2",
  "mcp>=1.0.0",
  "langgraph>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
gmail = [
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
]
eval = [
  "matplotlib>=3.10.0",
  "numpy>=2.0.0",
]
langchain = [
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-community>=0.2.0",
]

[tool.setuptools]
packages = ["agents", "api", "config", "core", "frontend", "langchain_version", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
